<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑리스트</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    background: linear-gradient(135deg, #f4f6fb, #e9edf5);
    color: #1f2937;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 28px 24px 24px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 22px;
    text-align: center;
    color: #111827;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  #item-input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }

  #item-input:focus {
    border-color: #6366f1;
  }

  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  #add-btn:hover {
    background: #4f46e5;
  }

  .summary {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 10px;
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li.item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #f0f1f3;
  }

  li.item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: #6366f1;
    cursor: pointer;
  }

  li.item span.text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    transition: color 0.15s;
  }

  li.item.checked span.text {
    text-decoration: line-through;
    color: #9ca3af;
  }

  li.item .delete-btn {
    border: none;
    background: transparent;
    color: #9ca3af;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  li.item .delete-btn:hover {
    color: #ef4444;
    background: #fee2e2;
  }

  .empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 30px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🛒 쇼핑리스트</h1>
    <div class="input-row">
      <input id="item-input" type="text" placeholder="살 물건을 입력하세요" maxlength="100" />
      <button id="add-btn">추가</button>
    </div>
    <div class="summary" id="summary"></div>
    <ul id="list"></ul>
  </div>

<script>
  const STORAGE_KEY = "shopping-list-items";

  const input = document.getElementById("item-input");
  const addBtn = document.getElementById("add-btn");
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = loadItems();

  function render() {
    list.innerHTML = "";

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "목록이 비어 있습니다. 아이템을 추가해 보세요!";
      list.appendChild(empty);
    } else {
      items.forEach((item) => {
        const li = document.createElement("li");
        li.className = "item" + (item.checked ? " checked" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.checked;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "✕";
        deleteBtn.setAttribute("aria-label", "삭제");
        deleteBtn.addEventListener("click", () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    const total = items.length;
    const done = items.filter((i) => i.checked).length;
    summary.textContent = total === 0 ? "" : `${done} / ${total} 완료`;
  }

  function addItem() {
    const value = input.value.trim();
    if (!value) {
      input.focus();
      return;
    }
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: value,
      checked: false,
    });
    saveItems(items);
    input.value = "";
    input.focus();
    render();
  }

  function toggleItem(id) {
    items = items.map((item) =>
      item.id === id ? { ...item, checked: !item.checked } : item
    );
    saveItems(items);
    render();
  }

  function deleteItem(id) {
    items = items.filter((item) => item.id !== id);
    saveItems(items);
    render();
  }

  addBtn.addEventListener("click", addItem);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      addItem();
    }
  });

  render();
</script>
</body>
</html>
